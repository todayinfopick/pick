name: 쇼츠 샘플 (시험)
on:
  push:
    branches: [claude/shorts-sample]
permissions:
  contents: write
jobs:
  sample:
    if: "!contains(github.event.head_commit.message, '[sample]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      GOOGLE_SHEET_ID: 18BVfA22ELRzZE6_fWLRy5Qgi-E1y7aY-n44NDfC2h9o
      GOOGLE_PHOTO_FOLDER_ID: 1eo1ooVxJ3eqTuEfIINj58eGcbVOTFI03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum tesseract-ocr tesseract-ocr-kor > /dev/null
      - run: python cloud_sync.py pull
      - run: python shorts.py "리빙메이트" | tee sample.log
      - name: 샘플 올리기
        run: |
          mkdir -p sample && cp out/쇼츠_*.mp4 sample/ && cp sample.log sample/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sample && git commit -qm "쇼츠 샘플 [sample]" && git push

name: 블로그 글 만들기

on:
  schedule:
    # 매일 한국 시간 새벽 5시 30분쯤 (무료 예약은 조금 늦게 돌 수 있음)
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "블로그 (비우면 전부, 예: naver1,tistory)"
        type: string
        default: ""
      count:
        description: "블로그마다 몇 편 (0이면 blog_config.json 설정대로)"
        type: string
        default: "0"

concurrency:
  group: blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 예약 실행을 잠시 멈추려면 저장소 변수 AUTO_BLOG=off
    if: github.event_name != 'schedule' || vars.AUTO_BLOG != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      # 비밀값은 자동 게시와 같은 것을 씀 (제미나이·Claude·Pixabay 키가 ENV_FILE 안에 있음)
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      GOOGLE_SHEET_ID: 18BVfA22ELRzZE6_fWLRy5Qgi-E1y7aY-n44NDfC2h9o
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬·글꼴 준비
        run: |
          pip install -q -r requirements.txt
          sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: 설정 준비
        run: python -c "import cloud_sync; cloud_sync.write_env()"

      # 만든 글은 main이 아니라 blog-packages 브랜치에 쌓음 (자동 게시 기록과 섞이지 않게)
      - name: 패키지 브랜치 받기
        run: |
          if git fetch -q --depth 1 origin blog-packages; then
            git worktree add -q site FETCH_HEAD
          else
            git worktree add -q --detach site
            git -C site checkout -q --orphan blog-packages
            git -C site rm -rq --cached . && find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: 글 쓰기
        run: python blog_auto.py --site site --blog "${{ inputs.blog }}" --count "${{ inputs.count || '0' }}"

      - name: 결과 저장
        if: always()
        run: |
          cd site
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          # 지난 기록은 남기지 않고 지금 파일만 커밋 하나로 (사진이 매일 쌓여 저장소가 커지지 않게)
          git checkout -q --orphan "snapshot-${GITHUB_RUN_ID:-local}"
          git add -A
          git commit -q -m "블로그 패키지 $(date +%F)"
          git push -q -f origin HEAD:blog-packages

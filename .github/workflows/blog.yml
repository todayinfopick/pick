name: 블로그 글 만들기

on:
  schedule:
    # 매일 한국 시간 새벽 5시 30분쯤 (무료 예약은 조금 늦게 돌 수 있음, 쿠팡 자동화 6시대와 겹치지 않게)
    # 글은 새벽 4시에 Claude가 써서 drafts/에 올리고, 이 예약은 남은 초안을 정리한 뒤
    # 오늘 글이 없는 블로그만 비상용 글(drafts/stock/)이나 제미나이로 채우는 예비
    - cron: "30 20 * * *"
    # 새벽 3시 25분쯤: 인기 검색어·검색량만 모아 keywords.json으로 (3시 52분 Claude 글쓰기가 읽음)
    - cron: "25 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "할 일"
        type: choice
        default: 글쓰기
        options: [글쓰기, 초안 정리, 키워드]
      blog:
        description: "블로그 (비우면 전부, 예: naver1,tistory)"
        type: string
        default: ""
      count:
        description: "블로그마다 몇 편 (0이면 blog_config.json 설정대로)"
        type: string
        default: "0"

concurrency:
  group: blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 예약 실행을 잠시 멈추려면 저장소 변수 AUTO_BLOG=off
    if: github.event_name != 'schedule' || vars.AUTO_BLOG != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      # 비밀값은 자동 게시와 같은 것을 씀 (제미나이·Claude·Pixabay 키가 ENV_FILE 안에 있음)
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      GOOGLE_SHEET_ID: 18BVfA22ELRzZE6_fWLRy5Qgi-E1y7aY-n44NDfC2h9o
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬·글꼴 준비
        run: |
          pip install -q -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum tesseract-ocr tesseract-ocr-kor > /dev/null

      - name: 설정 준비
        run: python cloud_sync.py env

      # 만든 글은 main이 아니라 blog-packages 브랜치에 쌓음 (자동 게시 기록과 섞이지 않게)
      - name: 패키지 브랜치 받기
        run: |
          if git fetch -q --depth 1 origin blog-packages; then
            git rev-parse FETCH_HEAD > base_sha.txt
            git worktree add -q site FETCH_HEAD
          else
            git worktree add -q --detach site
            git -C site checkout -q --orphan blog-packages
            git -C site rm -rq --cached . && find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: 키워드 모으기 (인기 검색어·검색량·경쟁도)
        if: inputs.mode != '초안 정리'
        continue-on-error: true
        run: python blog_keywords.py --site site

      - name: 글 쓰기
        if: inputs.mode != '키워드' && github.event.schedule != '25 18 * * *'
        run: >-
          python blog_auto.py --site site --blog "${{ inputs.blog }}" --count "${{ inputs.count || '0' }}"
          ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
          ${{ inputs.mode == '초안 정리' && '--drafts' || '' }}

      - name: 결과 저장
        if: always()
        run: |
          cd site
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          # 지난 기록은 남기지 않고 지금 파일만 커밋 하나로 (사진이 매일 쌓여 저장소가 커지지 않게)
          # 이 작업이 도는 동안 프로그램·스튜디오가 올린 것(초안, 완료 표시, 지운 글)을 잃지 않게 옮겨 담고 나서 저장
          for try in 1 2 3; do
            git fetch -q --depth 1 origin blog-packages || true
            if [ -f ../base_sha.txt ] && [ "$(git rev-parse FETCH_HEAD)" != "$(cat ../base_sha.txt)" ]; then
              git diff --binary "$(cat ../base_sha.txt)" FETCH_HEAD -- . ':(exclude)index.json' ':(exclude)done.json' > ../others.patch || true
              [ -s ../others.patch ] && { git apply --reject ../others.patch || echo "일부 변경은 옮기지 못함"; }
              git show FETCH_HEAD:done.json > done.json 2>/dev/null || true
              find . -name '*.rej' -delete
            fi
            # 지운 글(content.json 없음)은 목록에서 빼고, 목록에 없는 글 폴더(지우고 남은 사진·영상)도 정리 (지운 글이 목록에 다시 뜨지 않게)
            python3 -c "import json,os,glob,shutil;p='index.json';d=json.load(open(p,encoding='utf-8'));d['packages']=[x for x in d['packages'] if os.path.isfile(x['id']+'/content.json')];json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=1);k={x['id'] for x in d['packages']};[shutil.rmtree(f) for f in glob.glob('20??-??-??/*/') if f.rstrip('/') not in k]"
            lease=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            git checkout -q --orphan "snapshot-${GITHUB_RUN_ID:-local}-$try"
            git add -A
            git commit -q -m "블로그 패키지 $(date +%F)"
            if git push -q --force-with-lease=blog-packages:$lease origin HEAD:blog-packages; then break; fi
            echo "$lease" > ../base_sha.txt
          done

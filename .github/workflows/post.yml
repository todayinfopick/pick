name: 자동 게시

on:
  schedule:
    # 15분마다 확인만 하고, 프로그램 설정의 '게시 시각'(시트 '_설정' 탭 POST_TIMES)이 지난 회차만 게시.
    # 무료 예약은 몇 시간씩 늦거나 빠지기도 해서(실제로 하루 몇 번만 돌기도 함) 자주 확인하면 놓친 회차를 다음 확인 때 올림
    - cron: "7,22,37,52 * * * *"
    # 토큰 연장: 매주 일요일 한국 시간 08:00
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "할 일"
        type: choice
        default: 지금 게시
        options: [지금 게시, 미리보기, 일반 글 게시, 일반 글 미리보기, 토큰 연장, 예약 확인]

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 예약 실행을 잠시 멈추려면 저장소 변수 AUTO_POST=off
    # '예약 확인'은 외부 알람(cron-job.org)이 15분마다 부르는 것 — GitHub 예약과 똑같이 동작
    if: (github.event_name != 'schedule' && inputs.mode != '예약 확인') || vars.AUTO_POST != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      CHECK: ${{ github.event.schedule == '7,22,37,52 * * * *' || inputs.mode == '예약 확인' }}
      PYTHONUTF8: "1"
      # 비밀값은 두 개뿐: 구글 키 파일 내용(GOOGLE_SA_JSON), PC .env 내용 통째(ENV_FILE)
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      GOOGLE_SHEET_ID: 18BVfA22ELRzZE6_fWLRy5Qgi-E1y7aY-n44NDfC2h9o
      GOOGLE_PHOTO_FOLDER_ID: 1eo1ooVxJ3eqTuEfIINj58eGcbVOTFI03
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 준비
        run: pip install -q -r requirements.txt

      # 15분마다 예약 실행: 게시할 회차가 됐는지만 먼저 확인 (안 됐으면 여기서 끝)
      - name: 예약 회차 확인
        id: check
        if: env.CHECK == 'true'
        run: python cloud_sync.py due

      # 글꼴 + 사진 속 글자 확인(OCR, 한국어): 글자 박힌 사진은 인스타·쓰레드에 안 쓰려고
      - name: 글꼴·글자 인식 준비
        if: (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum tesseract-ocr tesseract-ocr-kor > /dev/null

      - name: 시트·사진 받기
        if: (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: python cloud_sync.py pull

      - name: 토큰 연장
        if: github.event.schedule == '0 23 * * 6' || inputs.mode == '토큰 연장'
        run: python refresh_tokens.py

      - name: 미리보기
        if: inputs.mode == '미리보기'
        run: python main.py --dry-run

      - name: 게시
        if: steps.check.outputs.due == '1'
        run: python main.py --slot "${{ steps.check.outputs.slot }}"

      - name: 지금 게시
        if: inputs.mode == '지금 게시'
        run: python main.py

      # 유튜브 쇼츠: 오늘 게시한 상품으로 하루 몇 개 만들어 쇼츠 받기 페이지에 올림 (설정 SHORTS_ON이 켜져 있을 때만)
      - name: 쇼츠 만들기
        if: "!cancelled() && (steps.check.outputs.due == '1' || inputs.mode == '지금 게시')"
        continue-on-error: true
        env:
          SHORTS_GH_TOKEN: ${{ github.token }}
        run: python shorts.py --daily

      - name: 일반 글
        if: "!cancelled() && steps.check.outputs.gdue == '1'"
        run: python general.py --slot "${{ steps.check.outputs.gslot }}"

      - name: 일반 글 지금 게시
        if: inputs.mode == '일반 글 게시'
        run: python general.py

      - name: 일반 글 미리보기
        if: inputs.mode == '일반 글 미리보기'
        run: python general.py --dry-run

      - name: 링크 페이지 만들기
        if: always() && (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: python build_page.py

      - name: 결과 저장
        if: always() && (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: |
          python cloud_sync.py push || true
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          for f in posted.json research.json docs; do [ -e "$f" ] && git add -f "$f"; done
          git diff --cached --quiet || (git commit -q -m "게시 기록 업데이트" && git pull -q --rebase && git push -q)

      - name: 미리보기 이미지
        if: inputs.mode == '미리보기'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: media/

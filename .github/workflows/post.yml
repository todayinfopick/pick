name: 자동 게시
# 영상 다시 만들기 실행은 이름을 달리 (PC '🎬 만드는 중' 목록이 만드는 중인지 알아봄)
run-name: ${{ inputs.mode == '쇼츠 다시 만들기' && '영상 다시 만들기' || '자동 게시' }}

on:
  schedule:
    # 15분마다 확인만 하고, 프로그램 설정의 '게시 시각'(시트 '_설정' 탭 POST_TIMES)이 지난 회차만 게시.
    # 무료 예약은 몇 시간씩 늦거나 빠지기도 해서(실제로 하루 몇 번만 돌기도 함) 자주 확인하면 놓친 회차를 다음 확인 때 올림
    - cron: "7,22,37,52 * * * *"
    # 토큰 연장: 매주 일요일 한국 시간 08:00
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "할 일"
        type: choice
        default: 지금 게시
        options: [지금 게시, 미리보기, 일반 글 게시, 일반 글 미리보기, 직접 쓴 글 게시, 토큰 연장, 예약 확인, 쇼츠 다시 만들기]
      product:
        description: "쇼츠 다시 만들기: 파트너스 링크 또는 상품명 일부"
        type: string
        default: ""
      script:
        description: "쇼츠 다시 만들기: 고친 대본 (한 줄에 한 문장, 비우면 AI가 씀)"
        type: string
        default: ""
      photos:
        description: "쇼츠 다시 만들기: 게시함에서 확인한 사진 폴더 (manual/reel/…, 비우면 상품 사진)"
        type: string
        default: ""
      tag:
        description: "쇼츠 다시 만들기: 영상을 붙일 게시함 글 번호"
        type: string
        default: ""

# 영상 다시 만들기(등록·목록 탭 🎬)는 따로 줄을 섬: 영상이 여러 개 밀려도 발행은 제시간에 (사용자 11/25)
# 기록(posted.json)은 json_merge.py가 글·칸별로 합쳐서 동시에 저장해도 서로 안 지움
concurrency:
  group: ${{ inputs.mode == '쇼츠 다시 만들기' && 'remake' || 'autopost' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 블로그 예약 따라잡기 (2026-11-05: GitHub 예약이 밤새 하나도 안 돌아 키워드·글이 없었음).
  # 이 작업은 외부 알람이 15분마다 부르므로, 오늘 블로그 키워드·예약 글을 아직 안 했으면 blog.yml '예약 확인'을 대신 부름.
  # 한국 시간 03:30~05:59, 07:00~13:59만 (6시대는 쿠팡 자동화와 겹치지 않게). 이미 했거나 돌고 있으면 아무것도 안 함.
  blog_kick:
    if: (github.event_name == 'schedule' || inputs.mode == '예약 확인') && vars.AUTO_BLOG != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          TZ: Asia/Seoul
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date +%F); hm=$((10#$(date +%H%M)))
          if ! { [ $hm -ge 330 ] && [ $hm -lt 600 ]; } && ! { [ $hm -ge 700 ] && [ $hm -lt 1400 ]; }; then echo "블로그 확인 시간 아님 ($hm)"; exit 0; fi
          raw=https://raw.githubusercontent.com/$GH_REPO/blog-packages
          kwday=$(curl -fsS "$raw/keywords.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('updated','')[:10])" 2>/dev/null || true)
          autoday=$(curl -fsS "$raw/auto_day.txt?t=$(date +%s)" 2>/dev/null | head -c 10 || true)
          echo "오늘 $today $hm / 키워드 $kwday / 예약 글 $autoday"
          need=0
          [ "$kwday" != "$today" ] && need=1
          [ "$autoday" != "$today" ] && [ $hm -ge 530 ] && need=1
          [ $need = 0 ] && { echo "오늘 블로그 할 일은 다 했어요"; exit 0; }
          busy=$(gh run list -w blog.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
          [ "$busy" != "0" ] && { echo "블로그 작업이 이미 돌고 있어요"; exit 0; }
          # 실패해도 15분마다 다시 부르지 않게: 마지막 블로그 작업이 시작된 지 55분이 안 됐으면 기다림 (예전 매시 따라잡기와 같은 간격)
          last=$(gh run list -w blog.yml -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 3300 ]; then echo "최근 블로그 작업 $last → 다음에 확인"; exit 0; fi
          gh workflow run blog.yml -f mode="예약 확인" && echo "블로그 '예약 확인'을 불렀어요"

  # 줄 선 영상 요청(remake_queue/)이 남아 있으면 '쇼츠 다시 만들기'를 부름 (요청 실행이 취소됐거나 한 번에 다 못 만든 것)
  remake_kick:
    if: github.event_name == 'schedule' || inputs.mode == '예약 확인'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$GH_REPO/contents/remake_queue?ref=main" --jq 'length' 2>/dev/null || echo 0)
          echo "줄 선 영상 요청 $n개"
          [ "$n" -gt 0 ] 2>/dev/null && gh workflow run post.yml -f mode="쇼츠 다시 만들기" && echo "영상 만들기를 불렀어요" || true

  run:
    # 예약 실행을 잠시 멈추려면 저장소 변수 AUTO_POST=off
    # '예약 확인'은 외부 알람(cron-job.org)이 15분마다 부르는 것 — GitHub 예약과 똑같이 동작
    if: (github.event_name != 'schedule' && inputs.mode != '예약 확인') || vars.AUTO_POST != 'off'
    runs-on: ubuntu-latest
    # actions: write = 영상 요청이 남으면 다음 묶음을 바로 부르기 (11/26)
    permissions:
      contents: write
      actions: write
    # 게시 도중 끊기면 기록을 못 남겨 다음 실행이 같은 글을 또 올림 → 넉넉히 (보통 5분 안에 끝남)
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      # 로그를 바로바로 남김 (끊겨도 무엇을 올렸는지 보이게) + 올릴 때마다 게시 기록을 저장소에 바로 올림
      PYTHONUNBUFFERED: "1"
      SAVE_PUSH: "1"
      CHECK: ${{ github.event.schedule == '7,22,37,52 * * * *' || inputs.mode == '예약 확인' }}
      PYTHONUTF8: "1"
      # 비밀값은 두 개뿐: 구글 키 파일 내용(GOOGLE_SA_JSON), PC .env 내용 통째(ENV_FILE)
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      # 선불 Gemini 키는 ENV_FILE/Google Sheets와 분리하여 Actions Secret에서만 읽음
      GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
      GOOGLE_SHEET_ID: 18BVfA22ELRzZE6_fWLRy5Qgi-E1y7aY-n44NDfC2h9o
      GOOGLE_PHOTO_FOLDER_ID: 1eo1ooVxJ3eqTuEfIINj58eGcbVOTFI03
    steps:
      # 앞 실행이 끝나길 기다렸다 시작하는 경우가 있어서, 실행을 만든 시점이 아닌 지금의 최신 기록(posted.json)을 받는다.
      # (예전 기록을 받으면 방금 올린 회차를 다시 올려 글이 두 번 올라감)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 프로그램 코드는 비공개 저장소(pick-app)에 있음: 실행할 때만 꺼내 와서 이 폴더에 놓는다
      # (이 저장소의 기록 파일 posted.json·docs 등은 덮어쓰지 않음)
      - name: 프로그램 받기
        uses: actions/checkout@v4
        with:
          repository: todayinfopick/pick-app
          token: ${{ secrets.CODE_TOKEN }}
          path: _app

      - name: 프로그램 놓기
        run: tar -C _app --exclude=./.git --exclude=./.github -cf - . | tar -xf - --skip-old-files && rm -rf _app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 준비
        run: pip install -q -r requirements.txt

      # 15분마다 예약 실행: 게시할 회차가 됐는지만 먼저 확인 (안 됐으면 여기서 끝)
      - name: 예약 회차 확인
        id: check
        if: env.CHECK == 'true'
        run: python cloud_sync.py due

      # 토큰 연장: 깃허브 주간 예약은 거의 안 돌아서, 15분 알람이 일·수요일 한국 시간 8시대에 올 때 연장
      # (8시대에 여러 번 와도 연장은 몇 번 더 해질 뿐 문제없음)
      - name: 토큰 연장할 때인지
        id: when
        env:
          SCHED: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          weekly=0
          [ "$CHECK" = 'true' ] && [ "$(date +%H)" = 08 ] && [[ "$(date +%u)" =~ ^[37]$ ]] && weekly=1
          if [ "$SCHED" = '0 23 * * 6' ] || [ "$MODE" = '토큰 연장' ] || [ $weekly = 1 ]; then
            echo "refresh=1" >> "$GITHUB_OUTPUT"
          fi

      # 글꼴 + 사진 속 글자 확인(OCR, 한국어): 글자 박힌 사진은 인스타·쓰레드에 안 쓰려고
      - name: 글꼴·글자 인식 준비
        if: (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum tesseract-ocr tesseract-ocr-kor > /dev/null

      # 직접 쓴 글만 올리는 실행(지금 올리기·예약 글만 차례)이면 사진은 필요한 상품 것만 받음 (전체는 몇 분 걸림)
      - name: 시트·사진 받기
        if: (env.CHECK != 'true' || steps.check.outputs.any == '1' || steps.when.outputs.refresh == '1')
        env:
          # 직접 쓴 글만: 그 글 상품 사진만 / 예약 회차: 다음 차례 상품 사진만 (전부 받으면 10분 넘게 걸림) / 그 밖: 전부
          PULL_PHOTOS: ${{ (inputs.mode == '직접 쓴 글 게시' || (steps.check.outputs.mdue == '1' && steps.check.outputs.due != '1' && steps.check.outputs.gdue != '1' && steps.when.outputs.refresh != '1')) && 'manual' || (env.CHECK == 'true' && 'slot' || 'all') }}
        run: python cloud_sync.py pull

      - name: 토큰 연장
        if: steps.when.outputs.refresh == '1'
        run: python refresh_tokens.py

      - name: 미리보기
        if: inputs.mode == '미리보기'
        run: python main.py --dry-run

      - name: 게시
        if: steps.check.outputs.due == '1'
        run: python main.py --slot "${{ steps.check.outputs.slot }}"

      - name: 지금 게시
        if: inputs.mode == '지금 게시'
        run: python main.py

      # 유튜브 쇼츠: 오늘 게시한 상품으로 하루 몇 개 만들어 쇼츠 받기 페이지에 올림 (설정 SHORTS_ON이 켜져 있을 때만)
      - name: 쇼츠 만들기
        if: "!cancelled() && (steps.check.outputs.due == '1' || inputs.mode == '지금 게시')"
        continue-on-error: true
        env:
          SHORTS_GH_TOKEN: ${{ github.token }}
        run: python shorts.py --daily

      # PC 프로그램 목록 탭 🎬: 사진을 고친 뒤 그 상품 쇼츠만 다시 만들어 받기 페이지의 것을 바꿈
      - name: 쇼츠 다시 만들기
        if: inputs.mode == '쇼츠 다시 만들기'
        env:
          SHORTS_GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ inputs.product }}
          SHORTS_SCRIPT: ${{ inputs.script }}
          SHORTS_PHOTOS: ${{ inputs.photos }}
          SHORTS_TAG: ${{ inputs.tag }}
        # 11/24: 여러 개를 연달아 요청하면 기다리던 실행이 취소돼 요청이 사라졌음 → PC가 요청을 remake_queue/에 파일로 적고,
        # 이 실행이 줄 선 요청을 차례로 모두 만든 뒤 지움 (한 번에 최대 6개, 남은 것은 끝나자마자 다음 묶음을 부름)
        # 11/25 취소: PC '✖ 취소'가 요청 파일을 지우면, 아직 안 만든 것은 건너뛰고 만드는 중이면 15초 안에 멈춤.
        # 다 만든 요청은 바로 저장소에서 지움 (실행이 중간에 멈춰도 다시 만들지 않게)
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -n "$PRODUCT" ] && { python shorts.py --remake "$PRODUCT" || echo "::warning::영상 못 만듦: $PRODUCT"; }
          python - <<'PY'
          import json, os, pathlib, signal, subprocess, time
          def remote(f):  # 저장소에 요청 파일이 아직 있나 (PC가 취소하면 지워짐)
              r = subprocess.run(["gh", "api", f"repos/{os.environ['GH_REPO']}/contents/remake_queue/{f.name}?ref=main",
                                  "--jq", ".sha"], capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ("" if "404" in r.stderr else "?")
          # 11/25: 저장소 안의 요청 파일을 지우면(git rm) 게시 기록 저장과 엉켜 저장이 실패, 만든 영상 기록이 사라졌음
          # → 요청은 임시 폴더에 복사해 읽고, 저장소 쪽 파일은 손대지 않음 (지우기는 API로만 → 다음 pull에서 같이 지워짐)
          import shutil, tempfile
          tmp = pathlib.Path(tempfile.mkdtemp())
          for f in sorted(pathlib.Path("remake_queue").glob("*.json"))[:6]:
              shutil.copy(f, tmp / f.name)
          for f in sorted(tmp.glob("*.json")):
              try:
                  q = json.loads(f.read_text("utf-8"))
              except Exception:
                  q = {}
              if q.get("product") and remote(f):
                  env = dict(os.environ, SHORTS_SCRIPT=q.get("script", ""), SHORTS_PHOTOS=q.get("photos", ""),
                             SHORTS_TAG=str(q.get("tag", "")))
                  print(f"::group::영상 만들기 {q['product']}", flush=True)
                  p = subprocess.Popen(["python", "shorts.py", "--remake", q["product"]], env=env, start_new_session=True)
                  cancelled = False
                  while p.poll() is None:
                      time.sleep(15)
                      if p.poll() is None and not remote(f):
                          os.killpg(p.pid, signal.SIGKILL)
                          p.wait()
                          cancelled = True
                  subprocess.run(["git", "rebase", "--abort"], capture_output=True)  # 저장 도중 멈췄으면 되돌림
                  print("::endgroup::", flush=True)
                  if cancelled:
                      print(f"::notice::취소됨: {q['product']}", flush=True)
                  elif p.returncode:
                      print(f"::warning::영상 못 만듦: {q['product']}", flush=True)
              elif q.get("product"):
                  print(f"취소돼서 건너뜀: {q['product']}", flush=True)
              sha = remote(f)
              if sha and sha != "?":
                  subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{os.environ['GH_REPO']}/contents/remake_queue/{f.name}",
                                  "-f", "message=영상 요청 끝", "-f", f"sha={sha}", "-f", "branch=main"], capture_output=True)
          PY
          # 사용자 11/26 '6개 만들고 바로 6개를 새로': 요청이 남았으면 15분 확인을 기다리지 않고 다음 묶음을 바로 부름
          # (다 만든·못 만든 요청 파일은 위에서 지우므로 같은 것을 끝없이 부르지 않음)
          n=$(gh api "repos/$GH_REPO/contents/remake_queue?ref=main" --jq 'length' 2>/dev/null || echo 0)
          [ "$n" -gt 0 ] 2>/dev/null && gh workflow run post.yml -f mode="쇼츠 다시 만들기" && echo "남은 영상 요청 ${n}개 → 다음 묶음 바로 시작" || true

      - name: 일반 글
        if: "!cancelled() && steps.check.outputs.gdue == '1'"
        run: python general.py --slot "${{ steps.check.outputs.gslot }}"

      # PC 앱 '✍ 직접 쓰기·예약'으로 예약한 글 (manual/queue.json). 자동 게시를 꺼도 올라감
      - name: 직접 쓴 글
        if: "!cancelled() && (steps.check.outputs.mdue == '1' || inputs.mode == '직접 쓴 글 게시')"
        run: python manual_post.py

      # 확인 대기 방식(자동 게시 끔)으로 확정한 상품도 그날 쇼츠를 만들도록: 직접 쓴 글을 올린 뒤 한 번 더
      # (하루 개수 SHORTS_PER_DAY·상품당 한 번은 shorts.py가 지킴, 시트에 있는 상품만)
      - name: 쇼츠 만들기 (확정한 글)
        if: "!cancelled() && (steps.check.outputs.mdue == '1' || inputs.mode == '직접 쓴 글 게시')"
        continue-on-error: true
        env:
          SHORTS_GH_TOKEN: ${{ github.token }}
        run: python shorts.py --daily

      - name: 일반 글 지금 게시
        if: inputs.mode == '일반 글 게시'
        run: python general.py

      - name: 일반 글 미리보기
        if: inputs.mode == '일반 글 미리보기'
        run: python general.py --dry-run

      # 다음에 올라갈 상품의 사진 미리보기 (docs/preview/): 원할 때만 열어 사진을 빼거나 살림
      - name: 사진 미리보기 페이지
        if: "!cancelled() && inputs.mode != '직접 쓴 글 게시' && inputs.mode != '쇼츠 다시 만들기' && (env.CHECK != 'true' || (steps.check.outputs.any == '1' && (steps.check.outputs.due == '1' || steps.check.outputs.gdue == '1')))"
        continue-on-error: true
        run: python preview.py

      - name: 링크 페이지 만들기
        if: always() && inputs.mode != '쇼츠 다시 만들기' && (env.CHECK != 'true' || steps.check.outputs.any == '1')
        run: python build_page.py

      - name: 결과 저장
        if: always() && (env.CHECK != 'true' || steps.check.outputs.any == '1' || steps.when.outputs.refresh == '1')
        run: |
          python cloud_sync.py push || true
          git rebase --abort 2>/dev/null || true  # 게시 직후 저장이 중간에 멈췄으면 되돌림 (11/23 중복 게시)
          python json_merge.py setup . || true  # 기록 파일은 글·칸별로 합침 (영상 실행과 동시에 저장해도 안 지워지게)
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          for f in posted.json research.json ai_drop.json docs manual/done.json; do [ -e "$f" ] && git add -f "$f"; done
          git diff --cached --quiet || (git commit -q -m "게시 기록 업데이트" && git pull -q --rebase -X theirs && git push -q)

      - name: 미리보기 이미지
        if: inputs.mode == '미리보기'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: media/

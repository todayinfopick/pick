<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg:#fbf8f5; --card:#fff; --text:#1d1b1a; --muted:#8a817b; --accent:#ff6b4a; --accent2:#ff9a5a; --line:#efe8e2;
          --soft:#fff1ea; --shadow:0 6px 20px rgba(80,40,20,.07); }
  @media (prefers-color-scheme: dark) { :root { --bg:#121110; --card:#1c1a19; --text:#f4efeb; --muted:#a39a94;
          --line:#2c2826; --soft:#2a1f1b; --shadow:none; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:36px 16px 40px; }
  .avatar { width:76px; height:76px; border-radius:50%; margin:0 auto 12px; display:grid; place-items:center;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:30px; font-weight:800; }
  h1 { text-align:center; font-size:22px; margin:0 0 6px; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin:0 0 22px; }
  a.go { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text); background:var(--card);
         border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .thumbs { display:flex; flex:none; }
  .thumbs img { width:52px; height:52px; border-radius:12px; object-fit:cover; border:2px solid var(--card); margin-left:-14px; }
  .thumbs img:first-child { margin-left:0; }
  .t { flex:1; min-width:0; } .t b { display:block; font-size:17px; } .t span { color:var(--muted); font-size:13px; }
  .arrow { color:var(--accent); font-size:22px; font-weight:800; }
  .disc { font-size:13px; font-weight:700; line-height:1.6; background:var(--card); border:1px solid var(--accent);
          border-radius:12px; padding:10px 14px; margin:0 0 16px; }

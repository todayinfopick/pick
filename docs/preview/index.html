<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>게시 사진 미리보기</title><style>
body{margin:0;background:#f4f5f7;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111}
header{background:#0b0e1d;color:#ffe27a;padding:14px 16px;font-weight:800;font-size:19px;position:sticky;top:0;z-index:2}
header small{display:block;color:#cfd3e0;font-weight:400;font-size:12px;margin-top:4px}
h2{font-size:15px;margin:16px 12px 4px;color:#444}
.card{background:#fff;margin:10px 12px;padding:12px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.name{font-weight:700;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#eee;cursor:pointer;outline:3px solid #22c55e}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{position:absolute;left:4px;top:4px;font-style:normal;font-size:10px;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px;border-radius:6px}
.ph b{position:absolute;right:4px;bottom:4px;font-size:10px;background:#fff;padding:1px 5px;border-radius:6px}
.ph b:empty{display:none}
.ph.off{outline-color:#ef4444}.ph.off img{opacity:.3}
.ph.off::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:40px;font-weight:900}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px;display:flex;gap:8px;align-items:center}
.bar span{flex:1;font-size:13px;color:#555}
button{padding:11px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:700}
button.sub{background:#e5e7eb;color:#111;font-weight:400}
.empty{color:#777;margin:8px 12px}
</style></head><body>
<header>게시 사진 미리보기<small>초록 = 게시에 씀 · 빨강 = 뺌 (AI = AI가 뺀 것). 사진을 누르면 바뀌어요. 안 고치면 그대로 자동 게시돼요. (11-05 06:51 기준)</small></header>
<h2>1번 계정</h2><section class="card" data-k="홀리카홀리카 마이 페이브 피스 아이섀도 1.8g"><div class="name">홀리카홀리카 마이 페이브 피스 아이섀도 1.8g</div><div class="grid"><div class="ph" data-m="5e409bdc9783ad788a73308b4ae8a826" data-ai="0"><img src="img/5e409bdc9783ad788a73308b4ae8a826.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="e660d362f5a3c060f1e0011230c1d840" data-ai="0"><img src="img/e660d362f5a3c060f1e0011230c1d840.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph off" data-m="520bd6f791f9279d3da5fe273b66f39a" data-ai="1"><img src="img/520bd6f791f9279d3da5fe273b66f39a.jpg" loading="lazy"><i>대표</i><b>AI</b></div><div class="ph" data-m="a68450cb5fa0fc0b38d9a3e47a4f01fc" data-ai="0"><img src="img/a68450cb5fa0fc0b38d9a3e47a4f01fc.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="bba837d99943f1aaca39d0142734a52c" data-ai="0"><img src="img/bba837d99943f1aaca39d0142734a52c.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="fc3804674629ba84c330aa69840ce4fb" data-ai="0"><img src="img/fc3804674629ba84c330aa69840ce4fb.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="2924b1a10bf3f74f23bb1ff364b8897d" data-ai="0"><img src="img/2924b1a10bf3f74f23bb1ff364b8897d.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="97338c41046873fe1f9786abbf54ff0f" data-ai="0"><img src="img/97338c41046873fe1f9786abbf54ff0f.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="f709d57f2844ab3833dfe709ff2c4e88" data-ai="0"><img src="img/f709d57f2844ab3833dfe709ff2c4e88.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph off" data-m="1b90e5fee9386be748450cf1bf2ebd9a" data-ai="1"><img src="img/1b90e5fee9386be748450cf1bf2ebd9a.jpg" loading="lazy"><i>상세</i><b>AI</b></div><div class="ph off" data-m="4b15c2ccbff9b6a0bd4edeae1067484f" data-ai="1"><img src="img/4b15c2ccbff9b6a0bd4edeae1067484f.jpg" loading="lazy"><i>상세</i><b>AI</b></div><div class="ph" data-m="07ee049622dd680d24bd9280ad24117a" data-ai="0"><img src="img/07ee049622dd680d24bd9280ad24117a.jpg" loading="lazy"><i>상세</i><b></b></div></div></section>
<h2>2번 계정</h2><section class="card" data-k="에어룸 자가발열 히팅솜 극세사 스테이 침대패드"><div class="name">에어룸 자가발열 히팅솜 극세사 스테이 침대패드</div><div class="grid"><div class="ph" data-m="2358aa82d1de76f6c1fa966ea73d209b" data-ai="0"><img src="img/2358aa82d1de76f6c1fa966ea73d209b.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="5d909cce84887e4f85cd9a6b00587b47" data-ai="0"><img src="img/5d909cce84887e4f85cd9a6b00587b47.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="2290fe9900e28ba11a892d33d7b1aabf" data-ai="0"><img src="img/2290fe9900e28ba11a892d33d7b1aabf.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="e1f128fb0db5894c78045589f1786d02" data-ai="0"><img src="img/e1f128fb0db5894c78045589f1786d02.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="07198091afce29a7eb8d3129505ad9c3" data-ai="0"><img src="img/07198091afce29a7eb8d3129505ad9c3.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="f24cadf55a9bc5bb982b126a229c051e" data-ai="0"><img src="img/f24cadf55a9bc5bb982b126a229c051e.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="13acc6f5ad1fc3342aa148045e49a9fd" data-ai="0"><img src="img/13acc6f5ad1fc3342aa148045e49a9fd.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="5247ca5d7afa0340ec0888d3d027299e" data-ai="0"><img src="img/5247ca5d7afa0340ec0888d3d027299e.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph" data-m="c3d7e3a637f368f701417caafafdec37" data-ai="0"><img src="img/c3d7e3a637f368f701417caafafdec37.jpg" loading="lazy"><i>대표</i><b></b></div><div class="ph off" data-m="61a3c33b1999c8d82c45f749981052eb" data-ai="1"><img src="img/61a3c33b1999c8d82c45f749981052eb.jpg" loading="lazy"><i>상세</i><b>AI</b></div><div class="ph" data-m="7623fb06d3f8ed67685e1322879f8fb0" data-ai="0"><img src="img/7623fb06d3f8ed67685e1322879f8fb0.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="68102106d40beec59c891c86cd4c823e" data-ai="0"><img src="img/68102106d40beec59c891c86cd4c823e.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="e8128fb5da9f5f0cf63cf87493feb81d" data-ai="0"><img src="img/e8128fb5da9f5f0cf63cf87493feb81d.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="102e1dfea3bc2f655dd4a0f9c6a71d51" data-ai="0"><img src="img/102e1dfea3bc2f655dd4a0f9c6a71d51.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="fa24aca9879718d42ea65ee3aad62602" data-ai="0"><img src="img/fa24aca9879718d42ea65ee3aad62602.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="70506c659b5b58e6ea0c27b0953bd547" data-ai="0"><img src="img/70506c659b5b58e6ea0c27b0953bd547.jpg" loading="lazy"><i>상세</i><b></b></div><div class="ph" data-m="92adc5a282d7e21d227b5d1bd2f3057b" data-ai="0"><img src="img/92adc5a282d7e21d227b5d1bd2f3057b.jpg" loading="lazy"><i>상세</i><b></b></div></div></section>
<div class="bar"><span id="msg">바꾼 게 없어요</span><button class="sub" id="key">키</button><button id="save">저장</button></div>
<script>
const REPO='todayinfopick/pick', FILE='photo_exclude.json', API='https://api.github.com/repos/'+REPO+'/contents/'+FILE;
let data={}, sha=null, changed=0;
const msg=t=>document.getElementById('msg').textContent=t;
const tok=()=>{try{return localStorage.getItem('pick_token')||''}catch(e){return ''}};
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
async function load(){
  const h=tok()?{Authorization:'Bearer '+tok()}:{};
  try{const r=await fetch(API+'?ref=main&t='+Date.now(),{headers:h});if(r.ok){const j=await r.json();sha=j.sha;data=JSON.parse(b64d(j.content)||'{}')}}catch(e){}
  document.querySelectorAll('.card').forEach(c=>{const d=data[c.dataset.k]||{};c.querySelectorAll('.ph').forEach(p=>{
    const m=p.dataset.m;if((d.off||[]).includes(m))set(p,false,'직접 뺌');else if((d.on||[]).includes(m))set(p,true,'직접 살림')})});
}
function set(p,ok,why){p.classList.toggle('off',!ok);p.querySelector('b').textContent=why}
document.querySelectorAll('.ph').forEach(p=>p.onclick=()=>{
  const c=p.closest('.card'),k=c.dataset.k,m=p.dataset.m,ai=p.dataset.ai==='1',ok=p.classList.contains('off');
  const d=data[k]=data[k]||{off:[],on:[]};d.off=(d.off||[]).filter(x=>x!==m);d.on=(d.on||[]).filter(x=>x!==m);
  if(!ok)d.off.push(m);else if(ai)d.on.push(m);
  set(p,ok,ok?(ai?'직접 살림':''):'직접 뺌');changed++;msg('바꾼 것 '+changed+'개 · 저장을 눌러 주세요')});
document.getElementById('key').onclick=()=>{const t=prompt('깃허브 키를 붙여 넣어 주세요 (이 기기에만 저장돼요)',tok());if(t!==null){try{localStorage.setItem('pick_token',t.trim())}catch(e){}msg('키를 저장했어요')}};
document.getElementById('save').onclick=async()=>{
  if(!tok()){msg('먼저 키 버튼을 눌러 깃허브 키를 넣어 주세요');return}
  msg('저장 중…');
  for(let i=0;i<2;i++){
    const body={message:'미리보기에서 게시 사진 고침',content:b64e(JSON.stringify(data,null,1)),branch:'main'};if(sha)body.sha=sha;
    const r=await fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+tok(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){sha=(await r.json()).content.sha;changed=0;msg('✓ 저장했어요. 다음 게시부터 이대로 올라가요');return}
    if(r.status===409||r.status===422){const g=await fetch(API+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tok()}});if(g.ok)sha=(await g.json()).sha;continue}
    msg('⚠ 저장 실패 ('+r.status+'). 키에 Contents 쓰기 권한이 있는지 확인해 주세요');return}
  msg('⚠ 저장 실패. 새로고침 후 다시 해 주세요')};
load();
</script></body></html>
